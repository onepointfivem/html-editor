<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor de Slides HTML</title>
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <header id="toolbar">
    <div class="brand">
      <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M8 11.5v2.5M5 14h6"/></svg>
    </div>
    <input id="deck-title" type="text" aria-label="Título da apresentação" spellcheck="false">

    <div class="tb-group">
      <button class="tb-btn" data-action="text" title="Inserir texto">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 3.5h10M8 3.5v10"/></svg><span>Texto</span>
      </button>
      <button class="tb-btn icon" data-action="rect" title="Retângulo">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3.5" width="12" height="9" rx="1.5"/></svg>
      </button>
      <button class="tb-btn icon" data-action="ellipse" title="Elipse">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="8" cy="8" rx="6" ry="5"/></svg>
      </button>
      <button class="tb-btn icon" data-action="triangle" title="Triângulo">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 2.5l6 11H2z"/></svg>
      </button>
      <button class="tb-btn icon" data-action="line" title="Linha">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 13.5l11-11"/></svg>
      </button>
      <button class="tb-btn" data-action="button" title="Inserir botão">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="1.5" y="4.5" width="13" height="7" rx="3.5"/><path d="M5.5 8h5"/></svg><span>Botão</span>
      </button>
    </div>

    <div class="tb-group">
      <button class="tb-btn icon" data-action="undo" title="Desfazer (Ctrl+Z)">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3.5l-3 3 3 3"/><path d="M2.5 6.5h7a4 4 0 010 8H7"/></svg>
      </button>
      <button class="tb-btn icon" data-action="redo" title="Refazer (Ctrl+Y)">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3.5l3 3-3 3"/><path d="M13.5 6.5h-7a4 4 0 000 8H9"/></svg>
      </button>
      <button class="tb-btn icon" data-action="duplicate" title="Duplicar (Ctrl+D)">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 009.5 2h-6A1.5 1.5 0 002 3.5v6A1.5 1.5 0 003.5 11H5"/></svg>
      </button>
      <button class="tb-btn icon" data-action="delete" title="Excluir (Delete)">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4"/></svg>
      </button>
      <div class="dropdown">
        <button class="tb-btn" id="align-toggle" title="Alinhar e distribuir">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 1.5v13"/><rect x="3" y="3.5" width="10" height="3" rx=".5"/><rect x="5" y="9.5" width="6" height="3" rx=".5"/></svg><span>Alinhar</span>
          <svg viewBox="0 0 16 16" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6l4 4 4-4"/></svg>
        </button>
        <div class="menu" id="align-menu" hidden></div>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="tb-group end">
      <button class="tb-btn" data-action="open" title="Abrir um HTML exportado por este editor">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M2 4v8.5a1 1 0 001 1h10a1 1 0 001-1V6a1 1 0 00-1-1H8L6.5 3H3a1 1 0 00-1 1z"/></svg><span>Abrir</span>
      </button>
      <button class="tb-btn" data-action="export" title="Baixar apresentação como HTML">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M2.5 13.5h11"/></svg><span>Exportar HTML</span>
      </button>
      <button class="tb-btn primary" data-action="present" title="Apresentar a partir do slide atual (F5 = do início)">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M4.5 2.5l9 5.5-9 5.5z" fill="currentColor"/></svg><span>Apresentar</span>
      </button>
    </div>
  </header>

  <main>
    <aside id="slides-panel">
      <div id="slide-list"></div>
      <button id="add-slide" data-action="add-slide">+ Novo slide</button>
    </aside>

    <section id="stage">
      <div id="slide-wrap">
        <div id="slide" class="slide"></div>
      </div>
    </section>

    <aside id="props"></aside>
  </main>

  <!-- Mini barra de formatação durante a edição de texto -->
  <div id="textbar" hidden>
    <button data-cmd="bold" title="Negrito (Ctrl+B)"><b>B</b></button>
    <button data-cmd="italic" title="Itálico (Ctrl+I)"><i>I</i></button>
    <button data-cmd="underline" title="Sublinhado (Ctrl+U)"><u>U</u></button>
    <button data-cmd="strikeThrough" title="Tachado"><s>S</s></button>
    <span class="sep"></span>
    <label class="tb-color" title="Cor do texto selecionado">
      <span>A</span><input type="color" id="tb-color" value="#e11d48">
    </label>
    <span class="sep"></span>
    <button data-size="-1" title="Diminuir fonte">A−</button>
    <span id="tb-size">28</span>
    <button data-size="1" title="Aumentar fonte">A+</button>
    <span class="sep"></span>
    <button data-cmd="insertUnorderedList" title="Lista com marcadores">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 4h8M6 8h8M6 12h8"/><circle cx="2.5" cy="4" r=".8" fill="currentColor"/><circle cx="2.5" cy="8" r=".8" fill="currentColor"/><circle cx="2.5" cy="12" r=".8" fill="currentColor"/></svg>
    </button>
    <button data-cmd="insertOrderedList" title="Lista numerada">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 4h8M6 8h8M6 12h8"/><text x="0.5" y="6" font-size="5" fill="currentColor" stroke="none">1</text><text x="0.5" y="10" font-size="5" fill="currentColor" stroke="none">2</text><text x="0.5" y="14" font-size="5" fill="currentColor" stroke="none">3</text></svg>
    </button>
    <span class="sep"></span>
    <button data-align-text="left" title="Alinhar à esquerda">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 3.5h12M2 6.5h8M2 9.5h12M2 12.5h8"/></svg>
    </button>
    <button data-align-text="center" title="Centralizar">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 3.5h12M4 6.5h8M2 9.5h12M4 12.5h8"/></svg>
    </button>
    <button data-align-text="right" title="Alinhar à direita">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 3.5h12M6 6.5h8M2 9.5h12M6 12.5h8"/></svg>
    </button>
  </div>

  <!-- Modo apresentação -->
  <div id="present" hidden>
    <div id="present-frame"><div id="present-slide" class="slide"></div></div>
    <div id="present-counter"></div>
    <button id="present-exit" title="Sair (Esc)">✕</button>
  </div>

  <input type="file" id="open-file" accept=".html,.htm,text/html" hidden>

  <script src="js/state.js"></script>
  <script src="js/render.js"></script>
  <script src="js/align.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/textedit.js"></script>
  <script src="js/properties.js"></script>
  <script src="js/slides.js"></script>
  <script src="js/present.js"></script>
  <script src="js/export.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
